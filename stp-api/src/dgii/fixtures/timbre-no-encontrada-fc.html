<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultas Factura De Consumo - Verificaci&#xF3;n e-NCF</title>

    <environment include="Development">
        <link rel="stylesheet" href="/ecf/ConsultaTimbreFC/lib/bootstrap/dist/css/bootstrap.css" />
        <link rel="stylesheet" href="/ecf/ConsultaTimbreFC/css/site.css" />
    </environment>
    <environment exclude="Development">
        <link rel="stylesheet" href="https://ajax.aspnetcdn.com/ajax/bootstrap/3.3.7/css/bootstrap.min.css"
              asp-fallback-href="~/lib/bootstrap/dist/css/bootstrap.min.css"
              asp-fallback-test-class="sr-only" asp-fallback-test-property="position" asp-fallback-test-value="absolute" />
        <link rel="stylesheet" href="/ecf/ConsultaTimbreFC/css/site.min.css" asp-append-version="true" />
    </environment>
</head>
<body>
    

<style type="text/css">
    .dl-horizontal dt {
        width: auto !important;
        text-align: left !important;
    }

    table tr th {
        font-weight: bold;
        width: 20%;
    }

    .logo {
        width: 130%;
    }

    .header {
        padding: 7px 0 0 2%;
        color: rgb(125,125,125);
    }

    .table-container {
        color: rgb(125,125,125);
        margin: 1% 0 0 0;
    }

    @media screen and (max-width: 360px) {
        .logo {
            width: 100px !important;
        }

        .header {
            padding: 4px 0 0 30% !important;
        }

        .table-container {
            margin: 3% 0 0 0;
        }
    }

    @media screen and (max-width: 768px) {
        .logo {
            width: 350%;
        }

        table tr th {
            width: 60%;
        }

        .header {
            padding: 11px 0 0 11%;
        }

        .table-container {
            margin: 1.5% 0 0 0;
        }
    }
</style>

<div class="col-xs-12" style="padding:1% 0 0 0;">
    <div class="col-xs-12">
        <img src="/ecf/ConsultaTimbreFC/images/logo_dgii.svg" style="width:10%" />
    </div>
    <div class="col-xs-12">
        <h4><strong>Verificaci&#xF3;n e-NCF</strong></h4>
    </div>
</div>

<div class="col-xs-12 table-container">
    <table class="table table-striped">
        
            <tr class="text-danger" style="font-weight:bold;">
                <td colspan="2">No fue encontrada la factura (e-CF)</td>
            </tr>
    </table>
</div>



    <environment include="Development">
        <script src="/ecf/ConsultaTimbreFC/lib/jquery/dist/jquery.js"></script>
        <script src="/ecf/ConsultaTimbreFC/lib/bootstrap/dist/js/bootstrap.js"></script>
        <script src="/ecf/ConsultaTimbreFC/js/site.js" asp-append-version="true"></script>
    </environment>
    <environment exclude="Development">
        <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"
                asp-fallback-src="~/lib/jquery/dist/jquery.min.js"
                asp-fallback-test="window.jQuery"
                crossorigin="anonymous"
                integrity="sha384-K+ctZQ+LL8q6tP7I94W+qzQsfRV2a+AfHIi9k8z8l9ggpc8X+Ytst4yBo/hH+8Fk">
        </script>
        <script src="https://ajax.aspnetcdn.com/ajax/bootstrap/3.3.7/bootstrap.min.js"
                asp-fallback-src="~/lib/bootstrap/dist/js/bootstrap.min.js"
                asp-fallback-test="window.jQuery && window.jQuery.fn && window.jQuery.fn.modal"
                crossorigin="anonymous"
                integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa">
        </script>
        <script src="/ecf/ConsultaTimbreFC/js/site.min.js" asp-append-version="true"></script>
    </environment>

    
</body>
</html>

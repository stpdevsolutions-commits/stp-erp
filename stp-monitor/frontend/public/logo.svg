<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <!-- Icon: Radar eye 44x44 centered at 22,22 -->

  <!-- Glow backdrop -->
  <circle cx="22" cy="22" r="20" fill="#3b82f610"/>

  <!-- Outer ring -->
  <circle cx="22" cy="22" r="19" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>

  <!-- Mid ring -->
  <circle cx="22" cy="22" r="12" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Inner ring -->
  <circle cx="22" cy="22" r="6" stroke="#3b82f6" stroke-width="0.8" opacity="0.35"/>

  <!-- Sweep line (12 o'clock) -->
  <line x1="22" y1="22" x2="22" y2="3" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sweep ghost (at ~40°) -->
  <line x1="22" y1="22" x2="34" y2="7.5" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Radar blip on outer ring at top -->
  <circle cx="22" cy="3" r="2.2" fill="#3b82f6"/>

  <!-- Secondary blip on mid ring -->
  <circle cx="30.5" cy="13.5" r="1.5" fill="#3b82f6" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="22" cy="22" r="2.8" fill="#3b82f6"/>
  <circle cx="22" cy="22" r="1.1" fill="#0a0f1e"/>

  <!-- Cross hairs subtle -->
  <line x1="22" y1="41" x2="22" y2="38" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="3" y1="22" x2="6" y2="22" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="41" y1="22" x2="38" y2="22" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Wordmark: Vigía -->
  <text
    x="52"
    y="28"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#f9fafb"
    letter-spacing="-0.8"
  >Vigía</text>

  <!-- Accent line under wordmark -->
  <rect x="52" y="33" width="44" height="1.5" rx="1" fill="#3b82f6" opacity="0.7"/>

  <!-- Tagline -->
  <text
    x="52"
    y="47"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="7.5"
    font-weight="400"
    fill="#6b7280"
    letter-spacing="1.8"
  >INFRAESTRUCTURA BAJO CONTROL</text>
</svg>

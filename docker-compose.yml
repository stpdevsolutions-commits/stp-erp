services:
  # PostgreSQL Database
  stp-postgres:
    image: postgres:15-alpine
    container_name: stp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  stp-redis:
    image: redis:7-alpine
    container_name: stp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - stp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  stp-landing:
    build:
      context: ./stp-landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://stp-api:3001
    container_name: stp-landing
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://stp-api:3001
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    networks:
      - stp-network
    depends_on:
      - stp-api

  # NestJS API — modo producción (build multi-stage, sin hot-reload).
  # Para desarrollo: dockerfile Dockerfile.dev + volumen ./stp-api/src:/app/src
  # + command npm run start:dev + NODE_ENV=development en .env.
  stp-api:
    build:
      context: ./stp-api
      dockerfile: Dockerfile
    container_name: stp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    volumes:
      - /storage/erp-uploads:/app/uploads
    networks:
      - stp-network
    depends_on:
      stp-postgres:
        condition: service_healthy
      stp-redis:
        condition: service_healthy

  # Vaultwarden — gestor de contraseñas
  stp-vaultwarden:
    image: vaultwarden/server:latest
    container_name: stp-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.stpsoluciones.com"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SMTP_HOST: "smtp.resend.com"
      SMTP_FROM: "noreply@stpsoluciones.com"
      SMTP_PORT: "465"
      SMTP_SECURITY: "force_tls"
      SMTP_USERNAME: "resend"
      SMTP_PASSWORD: ${RESEND_API_KEY}
      SSO_ENABLED: ${VAULT_SSO_ENABLED:-false}
      SSO_ONLY: "false"
      SSO_AUTHORITY: "https://accounts.google.com"
      SSO_CLIENT_ID: ${VAULT_SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${VAULT_SSO_CLIENT_SECRET:-}
    volumes:
      - vaultwarden-data:/data
    networks:
      - stp-network

  # Nextcloud — almacenamiento de archivos
  stp-nextcloud:
    image: nextcloud:apache
    container_name: stp-nextcloud
    restart: unless-stopped
    environment:
      POSTGRES_HOST: stp-postgres
      POSTGRES_DB: nextcloud_db
      POSTGRES_USER: nextcloud_user
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASS}
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.stpsoluciones.com"
      REDIS_HOST: stp-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 512M
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: "https://cloud.stpsoluciones.com"
      OVERWRITEHOST: "cloud.stpsoluciones.com"
      TRUSTED_PROXIES: "172.0.0.0/8"
    volumes:
      - nextcloud-app:/var/www/html
      - /storage/nextcloud:/var/www/html/data
      - /storage/erp-named:/erp-named
    networks:
      - stp-network
    depends_on:
      stp-postgres:
        condition: service_healthy
      stp-redis:
        condition: service_healthy

  # AdGuard Home — DNS con bloqueo de anuncios
  stp-adguard:
    image: adguard/adguardhome:latest
    container_name: stp-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
      - ./adguard/certs:/opt/adguardhome/certs:ro
    networks:
      - stp-network

  # Uptime Kuma — monitoreo de servicios
  stp-uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: stp-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - stp-network

  # Caddy — reverse proxy interno (build personalizado con plugin cloudflare-dns)
  stp-caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: stp-caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/downloads:/srv/downloads:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - stp-network
    depends_on:
      - stp-landing
      - stp-api

  # Cloudflare Tunnel — solo expone la landing page pública (stpsoluciones.com)
  stp-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - stp-network
    depends_on:
      - stp-caddy

  # Vigía — backend de monitoreo
  vigia-backend:
    build:
      context: ./stp-monitor/backend
      dockerfile: Dockerfile
    container_name: vigia-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3002
      DB_HOST: stp-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: vigia_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_TO_EMAIL: ${ALERT_TO_EMAIL:-pedroangss@gmail.com}
      LOCAL_AGENT_KEY: ${LOCAL_AGENT_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data:/data:ro
      - /storage:/storage:ro
      # Solo lectura: ProjectsService corre git status/log ahí adentro (ver
      # src/projects/projects.service.ts). /data/estructuralrd ya viene con el
      # mount de /data de arriba.
      - /home/stp/stp:/repos/stp:ro
      - /home/stp/ecf-saas:/repos/ecf-saas:ro
      - /home/stp/mi-dia:/repos/mi-dia:ro
      # /proc del HOST (no el propio del contenedor) para medir Red de verdad:
      # las interfaces de red SIEMPRE están namespaced por contenedor en Linux
      # (a diferencia de CPU/RAM), así que sin esto MetricsService solo veía
      # el par veth interno de este contenedor — nunca el tráfico real del
      # servidor. Ver readHostNetworkTotals() en metrics.service.ts.
      - /proc:/hostproc:ro
    networks:
      - stp-network
      - estructuralrd_net
    depends_on:
      stp-postgres:
        condition: service_healthy

  # Vigía — dashboard frontend
  vigia-frontend:
    build:
      context: ./stp-monitor/frontend
      dockerfile: Dockerfile
    container_name: vigia-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_MONITOR_WS_URL: /ws
    networks:
      - stp-network
    depends_on:
      - vigia-backend


  # STP Tickets — backend (NestJS). Rastrea bugs/cambios/mejoras de TODOS los
  # proyectos de STP, no solo el ERP; por eso es su propio servicio en vez de
  # un módulo dentro de stp-api. Comparte el Postgres de siempre (tickets_db,
  # igual que Vigía usa vigia_db). Puerto en 127.0.0.1 para poder curl-earlo
  # directo por SSH (así lo uso yo) sin pasar por Caddy/VPN.
  stp-tickets-api:
    build:
      context: ./stp-tickets-api
      dockerfile: Dockerfile
    container_name: stp-tickets-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      PORT: 3003
      DB_HOST: stp-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: tickets_db
      TICKETS_AGENT_KEY: ${TICKETS_AGENT_KEY}
    networks:
      - stp-network
    depends_on:
      stp-postgres:
        condition: service_healthy

  # STP Tickets — frontend (Next.js, sin login). Gateado por Caddy remote_ip
  # igual que Vigía: se abre del cel con Tailscale, sin pantalla de acceso.
  stp-tickets-web:
    build:
      context: ./stp-tickets-web
      dockerfile: Dockerfile
    container_name: stp-tickets-web
    restart: unless-stopped
    environment:
      TICKETS_API_URL: http://stp-tickets-api:3003/api
      TICKETS_AGENT_KEY: ${TICKETS_AGENT_KEY}
    networks:
      - stp-network
    depends_on:
      - stp-tickets-api

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  nextcloud-app:
  uptime-kuma-data:
  vaultwarden-data:

networks:
  stp-network:
    driver: bridge
  estructuralrd_net:
    external: true
    name: estructuralrd_estructural_net

version: '3.8'

services:
  # PostgreSQL Database
  stp-postgres:
    image: postgres:15-alpine
    container_name: stp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  stp-redis:
    image: redis:7-alpine
    container_name: stp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - stp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  stp-landing:
    build:
      context: ./stp-landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://stp-api:3001
    container_name: stp-landing
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://stp-api:3001
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    networks:
      - stp-network
    depends_on:
      - stp-api

  # NestJS API
  stp-api:
    build:
      context: ./stp-api
      dockerfile: Dockerfile.dev
    container_name: stp-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./stp-api/src:/app/src
      - ./uploads:/app/uploads
    networks:
      - stp-network
    depends_on:
      stp-postgres:
        condition: service_healthy
      stp-redis:
        condition: service_healthy
    command: npm run start:dev

  # Nginx Reverse Proxy
  stp-nginx:
    image: nginx:alpine
    container_name: stp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - stp-network
    depends_on:
      - stp-api

  # Certbot — renueva certificados automáticamente cada 12h
  certbot:
    image: certbot/certbot
    container_name: stp-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet --webroot --webroot-path=/var/www/certbot;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres-data:
  redis-data:

networks:
  stp-network:
    driver: bridge
